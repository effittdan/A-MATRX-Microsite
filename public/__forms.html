<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="a-matrx-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="a-matrx-contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="facility" />
      <input type="text" name="specialty" />
      <textarea name="message"></textarea>
      <input type="text" name="contact_me" />
      <input name="bot-field" />
    </form>
  </body>
</html>
